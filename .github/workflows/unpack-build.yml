name: Build AJ from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -q AJ_v1_1_Fixed_Source.zip -d extracted

      - name: Build APK
        working-directory: extracted/PriyaAI
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AJ-debug-apk
          path: extracted/PriyaAI/app/build/outputs/apk/debug/app-debug.apk
          
